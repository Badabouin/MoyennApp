<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MoyennApp</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <!-- Favicon SVG : Chapeau de diplômé blanc sur fond noir -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000000'/%3E%3Cpath d='M32 14L6 26l26 12 21.5-9.9V41h4.5V26L32 14zm-16 19.5v8.5c0 4.4 7.2 8 16 8s16-3.6 16-8v-8.5l-16 7.4-16-7.4z' fill='%23ffffff'/%3E%3C/svg%3E">
</head>
<body>

  <!-- Bandeau supérieur avec Logo + Titre -->
  <header class="top-bar">
    <div class="brand-container">
      <div class="app-logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="28" height="28">
          <path d="M32 14L6 26l26 12 21.5-9.9V41h4.5V26L32 14zm-16 19.5v8.5c0 4.4 7.2 8 16 8s16-3.6 16-8v-8.5l-16 7.4-16-7.4z" fill="#ffffff"/>
        </svg>
      </div>
      <h1 class="brand-title">MoyennApp</h1>
    </div>
  </header>

  <main class="main-content">
    <!-- VUE 1 : DOSSIERS SCOLAIRES -->
    <div id="folders-view" class="view">
      <h2>Dossiers Scolaires</h2>
      <p class="subtitle">Sélectionnez ou créez un dossier. Cliquez sur un emoji pour le personnaliser.</p>

      <form id="folder-form" class="inline-form">
        <input type="text" id="folder-name" placeholder="ex: Année 2026-2027, Licence 1..." required>
        <button type="submit">Ajouter</button>
      </form>

      <div id="folders-list" class="cards-grid"></div>
    </div>

    <!-- VUE 2 : CONTENU DU DOSSIER (BLOCS + MATIÈRES SEULES) -->
    <div id="blocks-view" class="view hidden">
      <div class="view-top-nav">
        <button id="back-to-folders-btn" class="back-btn">← Retour aux dossiers</button>
        <button id="export-pdf-btn" type="button" class="pdf-btn">📄 Exporter une fiche bilan</button>
      </div>

      <h2 id="current-folder-title">Nom du dossier</h2>

      <section class="results">
        <h3>Moyenne Générale du dossier : <span id="folder-average">--</span> / 20</h3>
      </section>

      <!-- Deux boutons d'action principaux -->
      <div class="choice-buttons">
        <button id="show-block-form-btn" type="button" class="secondary-btn">+ Ajouter un Bloc</button>
        <button id="show-direct-sub-form-btn" type="button" class="secondary-btn">+ Ajouter une Matière</button>
      </div>

      <!-- Formulaire masqué : Créer un Bloc -->
      <form id="block-form" class="hidden box-form">
        <input type="text" id="block-name" placeholder="Nom du bloc (ex: Semestre 1, UE 1...)" required>
        <div class="form-actions">
          <button type="submit">Valider</button>
          <button type="button" id="cancel-block-btn" class="cancel-btn">Annuler</button>
        </div>
      </form>

      <!-- Formulaire masqué : Créer une Matière seule dans le dossier -->
      <form id="direct-subject-form" class="hidden box-form">
        <div class="inline-form">
          <input type="text" id="direct-subject-name" placeholder="Nom de la matière (ex: Maths)" required>
          <input type="number" id="direct-subject-coef" placeholder="Coef." step="any" min="0.01" value="1" required style="max-width: 85px;">
        </div>
        <div class="form-actions">
          <button type="submit">Valider</button>
          <button type="button" id="cancel-direct-sub-btn" class="cancel-btn">Annuler</button>
        </div>
      </form>

      <!-- Liste des blocs du dossier -->
      <div id="blocks-list" class="cards-grid"></div>

      <!-- Liste des matières seules du dossier -->
      <div id="direct-subjects-list" class="subjects-container"></div>
    </div>

    <!-- VUE 3 : CONTENU D'UN BLOC (MATIÈRES & NOTES) -->
    <div id="subjects-view" class="view hidden">
      <button id="back-to-blocks-btn" class="back-btn">← Retour au dossier</button>
      <h2 id="current-block-title">Nom du bloc</h2>

      <section class="results">
        <h3>Moyenne du Bloc : <span id="block-average">--</span> / 20</h3>
      </section>

      <!-- Ajouter une matière au bloc -->
      <form id="subject-form" class="inline-form">
        <input type="text" id="subject-name" placeholder="Nouvelle matière (ex: Maths)" required>
        <input type="number" id="subject-coef" placeholder="Coef." step="any" min="0.01" value="1" required style="max-width: 85px;">
        <button type="submit">+ Matière</button>
      </form>

      <!-- Liste des matières et leurs notes -->
      <div id="subjects-list" class="subjects-container"></div>
    </div>
  </main>

  <!-- MODALE DE SÉLECTION D'EMOJI PERSONNALISÉ -->
  <div id="emoji-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h4>Choisir un emoji</h4>
        <button type="button" id="close-emoji-modal" class="delete-btn">✕</button>
      </div>
      <div class="emoji-grid" id="emoji-presets"></div>
      <div class="inline-form" style="margin-top: 12px; margin-bottom: 0;">
        <input type="text" id="custom-emoji-input" placeholder="Ou tape ton emoji ici..." maxlength="4" style="text-align: center; font-size: 1.2rem;">
        <button type="button" id="save-custom-emoji-btn" class="primary-small-btn">OK</button>
      </div>
    </div>
  </div>

  <!-- ZONE CACHÉE UNIQUEMENT VISIBLE À L'IMPRESSION / EXPORT PDF -->
  <div id="print-bilan-container"></div>

  <script src="app.js"></script>
</body>
</html>
